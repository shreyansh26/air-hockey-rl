[preset.0]
name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="models/*.json,models/*.bin,models/**/*.json,models/**/*.bin"
exclude_filter="training/*,checks/*,.tools/*,validation/*,*.md"
export_path="builds/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/head_include="<style>html,body,canvas{touch-action:none;user-select:none;-webkit-user-select:none}body{overscroll-behavior:none}</style>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=1

[preset.1]
name="Android"
platform="Android"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="models/*.json,models/*.bin,models/**/*.json,models/**/*.bin"
exclude_filter="training/*,checks/*,.tools/*,validation/*,*.md"
export_path="builds/android/air-hockey-debug.apk"

[preset.1.options]
gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.shreyansh26.glide"
package/name="Glide Air Hockey"
package/signed=true
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
screen/edge_to_edge=false
permissions/internet=false
permissions/vibrate=true

[preset.2]
name="TrainingLinux"
platform="Linux"
runnable=false
custom_features="training"
export_filter="all_resources"
include_filter="models/*.json,models/*.bin,models/**/*.json,models/**/*.bin"
exclude_filter="checks/*,.tools/*,validation/*,*.md,assets/*"
export_path="builds/training/air-hockey.x86_64"

[preset.2.options]
binary_format/architecture="x86_64"
dedicated_server/strip_visuals=true

