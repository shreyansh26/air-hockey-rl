[preset.0]
name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="models/*.json,models/*.bin,models/**/*.json,models/**/*.bin"
exclude_filter="training/*,checks/*,.tools/*,validation/*,builds/*,android/*,*.md"
export_path="builds/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/head_include="<style>html,body,canvas{touch-action:none;user-select:none;-webkit-user-select:none}body{overscroll-behavior:none}</style><script>if(location.pathname.endsWith('/'))location.replace('index.html'+location.search+location.hash)</script>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=1

[preset.1]
name="Android"
platform="Android"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="models/*.json,models/*.bin,models/**/*.json,models/**/*.bin"
exclude_filter="training/*,checks/*,.tools/*,validation/*,builds/*,android/*,*.md"
export_path="builds/android/air-hockey-debug.apk"

[preset.1.options]
gradle_build/use_gradle_build=true
gradle_build/custom_theme_attributes={
"[splash]android:windowSplashScreenBackground": "#071621",
"[splash]windowSplashScreenBackground": "#071621"
}
launcher_icons/main_192x192="res://assets/icon.svg"
launcher_icons/adaptive_foreground_432x432="res://assets/icon-foreground.svg"
launcher_icons/adaptive_background_432x432="res://assets/icon-background.svg"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.shreyansh26.glide"
package/name="Glide Air Hockey"
package/signed=true
version/code=2
version/name="0.1.1"
screen/immersive_mode=true
screen/edge_to_edge=true
screen/background_color=Color(0.02745, 0.08627, 0.12941, 1)
permissions/internet=false
permissions/vibrate=true

[preset.2]
name="TrainingLinux"
platform="Linux"
runnable=false
custom_features="training"
export_filter="all_resources"
include_filter="models/*.json,models/*.bin,models/**/*.json,models/**/*.bin"
